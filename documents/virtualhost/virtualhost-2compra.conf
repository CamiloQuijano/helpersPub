<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile      /etc/ssl/certs/nextmovil—front-selfsigned.crt
    SSLCertificateKeyFile /etc/ssl/private/nextmovil—front-selfsigned.key

    ServerAdmin webmaster@localhost
    ServerName 2compra.nextmovil.co
    ServerAlias 2compra.nextmovil.co
    DocumentRoot /var/www/2compra.nextmovil.co/public_html
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    <DirectoryMatch "^/.*/\.git/">
        Require all denied
    </DirectoryMatch>

    
    <Directory /var/www/2compra.nextmovil.co/public_html>
	Options Indexes FollowSymLinks MultiViews
	AllowOverride All
	Order allow,deny
	allow from all
	Header set Access-Control-Allow-Origin "*"
    </Directory>
</VirtualHost>



